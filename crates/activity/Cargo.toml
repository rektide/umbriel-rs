[package]
name = "umbriel-activity"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "Tracing-native Umbriel activity example application and user service"
keywords = ["compositor", "activity", "journald", "tracing"]

[dependencies]
umbriel-tracking = { path = "../tracking", version = "0.1.0" }
umbriel-client = { path = "../umbriel-client", version = "0.1.0" }
umbriel-protocol = { path = "../umbriel-protocol", version = "0.1.0" }
umbriel-state = { path = "../umbriel-state", version = "0.1.0" }
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "signal", "time"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-journald = "0.3.2"
jiff = "0.2"
uuid = { version = "1", features = ["v4"] }
serde_json = "1"
systemd = "0.10.1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
tempfile = "3"
