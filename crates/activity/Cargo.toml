[package]
name = "umbriel-activity"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tracing-native Umbriel activity example application and user service"

[dependencies]
umbriel-tracking = { path = "../tracking" }
umbriel-client = { path = "../umbriel-client" }
umbriel-protocol = { path = "../umbriel-protocol" }
umbriel-state = { path = "../umbriel-state" }
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "signal", "time"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-journald = "0.3.2"
jiff = "0.2"
uuid = { version = "1", features = ["v4"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
