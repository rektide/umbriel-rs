[package]
name = "umbriel-polars"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "Finite lazy Polars queries over Umbriel snapshots"
keywords = ["polars", "dataframe", "lazy", "compositor"]

[dependencies]
polars = { version = "=0.55.2", default-features = false, features = ["lazy"] }
umbriel-arrow = { version = "0.1.0", path = "../umbriel-arrow" }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.48", features = ["io-util", "net", "rt", "macros"] }
umbriel-client = { path = "../umbriel-client" }
umbriel-protocol = { path = "../umbriel-protocol" }
