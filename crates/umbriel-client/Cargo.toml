[package]
name = "umbriel-client"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tokio Unix client and independently bounded Umbriel subscriptions"

[dependencies]
umbriel-protocol = { path = "../umbriel-protocol" }
umbriel-session = { path = "../umbriel-session" }
tokio = { version = "1.48", features = ["net", "rt", "sync", "time", "macros", "process", "io-util"] }
serde = "1"
sonic-rs = "0.5"
thiserror = "2"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
kubeless-view-impact = { path = "../../../kubeless/view/impact" }
umbriel-state = { path = "../umbriel-state" }
umbriel-tracking = { path = "../tracking" }
tokio = { version = "1.48", features = ["io-util", "test-util", "rt-multi-thread"] }
tempfile = "3"
socket2 = "0.6"
shlex = "2.0.1"

[[example]]
name = "active_window"
test = true

[[example]]
name = "window_changes"
test = true

[[bin]]
name = "umbriel-dump-desktop"
path = "src/bin/dump_desktop.rs"
